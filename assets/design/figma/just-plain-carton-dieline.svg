<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" fill="none">
  <defs>
    <style>
      .cut { stroke: #211D18; stroke-width: 2.5; stroke-linejoin: round; }
      .fold { stroke: #C67139; stroke-width: 1.6; stroke-dasharray: 8 7; }
      .guide { stroke: #817663; stroke-width: 1.2; stroke-dasharray: 3 6; }
      .label { fill: #211D18; font-family: Inter, Arial, sans-serif; font-weight: 800; }
      .small { fill: #817663; font-family: Inter, Arial, sans-serif; font-weight: 700; }
    </style>
  </defs>

  <g id="Dieline Header">
    <text id="Title" class="label" x="80" y="72" font-size="28">JUST PLAIN COFFEE — CARTON DIELINE</text>
    <text id="Subtitle" class="small" x="80" y="102" font-size="13" letter-spacing="1.2">FOUR-PANEL GABLE-TOP CARTON · CONSTRUCTION REFERENCE</text>
    <g id="Legend" transform="translate(805 54)">
      <path d="M0 0H48" class="cut"/>
      <text class="small" x="60" y="5" font-size="12">CUT</text>
      <path d="M130 0H178" class="fold"/>
      <text class="small" x="190" y="5" font-size="12">FOLD / SCORE</text>
    </g>
  </g>

  <g id="Panel Fills">
    <path id="Glue Tab Fill" d="M70 236H125V566L92 588L70 576V236Z" fill="#EEE7DB"/>
    <rect id="Side A Fill" x="125" y="236" width="150" height="330" fill="#F3EBDD"/>
    <rect id="Front Fill" x="275" y="236" width="250" height="330" fill="#FFF9EE"/>
    <rect id="Side B Fill" x="525" y="236" width="150" height="330" fill="#F3EBDD"/>
    <rect id="Back Fill" x="675" y="236" width="250" height="330" fill="#FFF9EE"/>
  </g>

  <g id="Cut Lines">
    <path id="Outer Cut"
      d="M70 236
         H125V132H275V112H525V132H675V112H925V132H960
         V236H925V566
         L905 610H695L675 566
         L655 610H545L525 566
         L505 610H295L275 566
         L255 610H145L125 566
         L92 588L70 576V236Z"
      class="cut"
      fill="none"
    />
    <path id="Top Slit A" d="M275 112V132" class="cut"/>
    <path id="Top Slit B" d="M525 112V132" class="cut"/>
    <path id="Top Slit C" d="M675 112V132" class="cut"/>
    <path id="Top Slit D" d="M925 112V132" class="cut"/>
  </g>

  <g id="Vertical Fold Lines">
    <path id="Glue Fold" d="M125 132V566" class="fold"/>
    <path id="Side A Front Fold" d="M275 112V566" class="fold"/>
    <path id="Front Side B Fold" d="M525 112V566" class="fold"/>
    <path id="Side B Back Fold" d="M675 112V566" class="fold"/>
    <path id="Back Closure Fold" d="M925 132V566" class="fold"/>
  </g>

  <g id="Horizontal Fold Lines">
    <path id="Top Body Fold" d="M125 236H925" class="fold"/>
    <path id="Bottom Body Fold" d="M125 566H925" class="fold"/>
    <path id="Fin Fold" d="M125 132H925" class="fold"/>
  </g>

  <g id="Gable Fold Lines">
    <path id="Side A Gable Left" d="M125 236L200 132" class="fold"/>
    <path id="Side A Gable Right" d="M275 236L200 132" class="fold"/>
    <path id="Side A Center Fold" d="M200 132V236" class="guide"/>
    <path id="Side B Gable Left" d="M525 236L600 132" class="fold"/>
    <path id="Side B Gable Right" d="M675 236L600 132" class="fold"/>
    <path id="Side B Center Fold" d="M600 132V236" class="guide"/>
  </g>

  <g id="Bottom Flap Folds">
    <path id="Side A Bottom Left" d="M125 566L200 610" class="guide"/>
    <path id="Side A Bottom Right" d="M275 566L200 610" class="guide"/>
    <path id="Front Bottom Left" d="M275 566L400 610" class="guide"/>
    <path id="Front Bottom Right" d="M525 566L400 610" class="guide"/>
    <path id="Side B Bottom Left" d="M525 566L600 610" class="guide"/>
    <path id="Side B Bottom Right" d="M675 566L600 610" class="guide"/>
    <path id="Back Bottom Left" d="M675 566L800 610" class="guide"/>
    <path id="Back Bottom Right" d="M925 566L800 610" class="guide"/>
  </g>

  <g id="Panel Labels">
    <text class="small" x="97" y="410" font-size="11" text-anchor="middle" transform="rotate(-90 97 410)">GLUE TAB</text>
    <text class="label" x="200" y="390" font-size="16" text-anchor="middle">SIDE A</text>
    <text class="label" x="400" y="390" font-size="16" text-anchor="middle">FRONT</text>
    <text class="label" x="600" y="390" font-size="16" text-anchor="middle">SIDE B</text>
    <text class="label" x="800" y="390" font-size="16" text-anchor="middle">BACK</text>
    <text class="small" x="400" y="184" font-size="11" text-anchor="middle">ROOF PANEL</text>
    <text class="small" x="800" y="184" font-size="11" text-anchor="middle">ROOF PANEL</text>
    <text class="small" x="200" y="184" font-size="11" text-anchor="middle">GABLE</text>
    <text class="small" x="600" y="184" font-size="11" text-anchor="middle">GABLE</text>
  </g>

  <g id="Print Safe Areas">
    <rect id="Front Safe Area" x="300" y="262" width="200" height="278" rx="8" class="guide"/>
    <rect id="Back Safe Area" x="700" y="262" width="200" height="278" rx="8" class="guide"/>
    <text class="small" x="400" y="530" font-size="9" text-anchor="middle">PRINT SAFE AREA</text>
    <text class="small" x="800" y="530" font-size="9" text-anchor="middle">PRINT SAFE AREA</text>
  </g>

  <g id="Construction Notes">
    <text class="label" x="80" y="680" font-size="14">ASSEMBLY LOGIC</text>
    <text class="small" x="80" y="706" font-size="11">1. Join glue tab to back panel  ·  2. Collapse opposing gables  ·  3. Seal roof fin  ·  4. Fold and seal bottom flaps</text>
  </g>
</svg>
